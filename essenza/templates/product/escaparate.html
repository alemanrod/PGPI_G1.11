{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Escaparate · Essenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background-color: #faf7f2;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* ====== CABECERA ====== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 30px;
      background-color: #fff;
      border-bottom: 2px solid #c06b3e;
    }

    .brand {
      font-size: 32px;
      color: #c06b3e;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .search-bar {
      flex: 1;
      margin: 0 20px;
    }

    .search-bar input {
      width: 100%;
      max-width: 380px;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      background: #fafafa;
    }

    .logout-btn {
      background-color: #c06b3e;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color .3s;
    }

    .logout-btn:hover {
      background-color: #a35a34;
    }

    /* ====== ESCAPARATE ====== */
    main {
      max-width: 1100px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      padding: 0 24px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
      text-align: center;
      padding: 16px;
      transition: transform .2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product-name {
      font-size: 15px;
      color: #333;
      margin-top: 10px;
      font-weight: 500;
    }

    .product-price {
      color: #c06b3e;
      font-weight: bold;
      margin-top: 6px;
    }
  </style>
</head>

<header>
    <div class="brand">ESSENZA</div>

    <div class="search-bar">
      <input type="text" placeholder="Buscar...">
    </div>

    {% if user.is_authenticated %}
      
      <form action="{% url 'logout' %}" method="post" style="margin:0;">
        {% csrf_token %}
        <button type="submit" class="logout-btn">Log out</button>
      </form>

    {% else %}

      <a href="{% url 'login' %}" class="logout-btn" style="text-decoration: none;">
        Log in
      </a>

    {% endif %}
    </header>
</html>
