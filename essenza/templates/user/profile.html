{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mi Perfil · Essenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <style>
    body {
        /* --- Variables de Color --- */
        --color-principal: #c06b3e;
        --color-principal-hover: #a35a34;
        --color-fondo: #faf7f2;
        --color-fondo-tarjeta: #fff;
        --color-texto-base: #333;
        --color-borde-claro: #eee;
        --color-error: #b00020;
        --color-foco-sombra: rgba(192, 107, 62, 0.2);
        --color-exito: #00695c; /* (Añadido para mensajes) */
        
        background-color: var(--color-fondo);
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    .page {
        min-height:100dvh; 
        display:flex; 
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap:2rem; 
    }
    .brand {
        color: var(--color-principal);
        font-size: 48px;
        margin-bottom: 10px;
        text-align: center;
    }
    .form-card {
        width: min(420px, 88vw);
        background: var(--color-fondo-tarjeta);
        border: 2px solid var(--color-principal);
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        padding: 22px 24px;
        box-sizing: border-box;
    }
    /* Estilos de botones y links (copiados) */
    .btn-primary {
        width: 100%;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--color-principal);
        color: var(--color-fondo-tarjeta);
        border: none;
        cursor: pointer;
        transition: background-color 0.3s;
        text-decoration: none; /* Para enlaces */
        display: inline-block; /* Para enlaces */
        box-sizing: border-box; /* Para enlaces */
        text-align: center; /* Para enlaces */
    }
    .btn-primary:hover {
        background-color: var(--color-principal-hover);
    }
    .login-link {
        margin-top: 15px;
        text-align: center;
        font-size: 13px;
    }
    .login-link a {
        color: var(--color-principal);
        text-decoration: underline;
    }

    /* (Añadido) Estilos para la vista de perfil */
    .profile-pic {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: 10px auto;
        border: 2px solid var(--color-principal);
    }
    .profile-data p {
        font-size: 16px;
        color: var(--color-texto-base);
        border-bottom: 1px solid var(--color-borde-claro);
        padding: 10px 0;
    }
    .profile-data strong {
        color: var(--color-principal);
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="brand">ESSENZA</h1>

    <div class="form-card">
      
      {% if user.photo %}
        <img src="{{ user.photo.url }}" alt="Foto de perfil" class="profile-pic">
      {% else %}
        <img src="{% static 'images/default_user.png' %}" alt="Foto de perfil por defecto" class="profile-pic">
      {% endif %}

      <div class="profile-data">
        <p><strong>Nombre:</strong> {{ user.first_name }}</p>
        <p><strong>Apellidos:</strong> {{ user.last_name }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
      </div>

      <a href="{% url 'profile_edit' %}" class="btn-primary">Editar mis datos</a>
      <p class="login-link">
        <a href="{% url 'profile_delete' %}" style="color: var(--color-error);">Eliminar mi cuenta</a>
      </p>
    </div>
  </div>
</body>
</html>
