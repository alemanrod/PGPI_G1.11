{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iniciar sesión · Essenza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* ====== Fondo pastel, layout y marca ====== */
    body.login-bg { background:#f7efef; margin:0; font-family:'Segoe UI',sans-serif; }
    .page{ min-height:100dvh; display:grid; place-items:start center; padding-top:56px; }
    .brand{
      font-size:38px; letter-spacing:.18em; color:#d64b7f; font-weight:700;
      text-transform:uppercase; margin-bottom:18px;
    }

    /* ====== Tarjeta del formulario ====== */
    .login-card{
      width:min(420px, 88vw); background:#fff; border:2px solid #f3b6c7; border-radius:16px;
      box-shadow:0 12px 28px rgba(0,0,0,.06); padding:22px 24px;
    }

    label{ display:block; font-size:13px; color:#333; margin:10px 0 6px; }
    input[type="text"], input[type="email"], input[type="password"]{
      width:90%; padding:10px 12px; border:1px solid #eee; border-radius:10px;
      background:#fafafa; outline:none;
    }
    input:focus{ border-color:#e7c8d3; box-shadow:0 0 0 3px rgba(214,75,127,.08); }

    .btn-primary{
      width:100%; margin-top:14px; padding:10px 12px; border-radius:10px;
      background:#2e2e2e; color:#fff; border:none; cursor:pointer;
    }
    .btn-primary:hover{ filter:brightness(1.06); }

    .forgot{ margin-top:10px; text-align:left; }
    .forgot a{ color:#333; text-decoration:underline; font-size:12.5px; }

    .form-error{ color:#b00020; margin:6px 0; }
  </style>
</head>

<body class="login-bg">


  <div class="page">
    <header class="brand">ESSENZA</header>

    <div class="login-card">
      <form method="post" novalidate>
        {% csrf_token %}
        
        <label for="id_email">Correo electrónico</label>
        {{ form.email }}
        
        <label for="id_password">Contraseña</label>
        {{ form.password }}

        {% if form.non_field_errors %}
          <p class="form-error">{{ form.non_field_errors.0 }}</p>
        {% endif %}

        <button type="submit" class="btn-primary">Iniciar sesión</button>
        
        <p class="forgot">
          <a href="{% url 'password_reset' %}">¿Has olvidado la contraseña?</a>
        </p>
      </form>
    </div>
  </div>

</body>
</html>
